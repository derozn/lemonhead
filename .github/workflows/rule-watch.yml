name: rule-watch

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run watcher
        run: node tools/govuk-mcp/src/watch.ts > findings.json && cat findings.json
      - name: Open deduped issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(jq length findings.json)
          echo "$count finding(s)"
          [ "$count" -eq 0 ] && exit 0
          existing=$(gh issue list --label rule-change --state open --json title --jq '.[].title')
          jq -c '.[]' findings.json | while read -r finding; do
            title=$(echo "$finding" | jq -r '.title')
            if echo "$existing" | grep -Fxq "$title"; then
              echo "skip (open issue exists): $title"
            else
              body=$(echo "$finding" | jq -r '.body')
              gh issue create --title "$title" --body "$body" --label rule-change
              echo "opened: $title"
            fi
          done
